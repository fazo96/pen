<?xml version="1.0" encoding="UTF-8"?>
<!--
  pen: logo. A fountain-pen nib pointing top right.

  Built pointing straight up on a 100×100 grid, then turned 45° by the
  "mark" group, so every shape stays simple to edit: select the group,
  Enter to go inside, and the nodes are where you'd expect.
  Colours are pen's palette: paper #f3ead3, ink #1f2433, accent #8a3324.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="512" height="512" viewBox="0 0 100 100">
  <g inkscape:groupmode="layer" inkscape:label="background">
    <rect id="tile" x="0" y="0" width="100" height="100" rx="22" fill="#f3ead3"/>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="mark">
    <g id="mark" transform="rotate(45 50 50) translate(0 -1)">
      <!-- Grip section behind the nib -->
      <rect id="section" x="38" y="72" width="24" height="22" rx="4" fill="#1f2433"/>
      <!-- Collar between section and nib -->
      <rect id="collar" x="35" y="68" width="30" height="6" rx="1.5" fill="#1f2433"/>
      <!-- The nib: pointed tip, swelling shoulders, square base -->
      <path id="nib" fill="#8a3324"
            d="M 50 8
               C 54 20, 64 34, 64 50
               L 62 70
               L 38 70
               L 36 50
               C 36 34, 46 20, 50 8 Z"/>
      <!-- Slit from the tip to the breather hole -->
      <rect id="slit" x="49.25" y="12" width="1.5" height="34" fill="#f3ead3"/>
      <!-- Breather hole -->
      <circle id="breather" cx="50" cy="48" r="3.4" fill="#f3ead3"/>
    </g>
  </g>
</svg>
